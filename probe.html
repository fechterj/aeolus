<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aeolus connection check</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;padding:20px max(16px,env(safe-area-inset-left)) 40px;background:#06090f;color:#dfe8f2;font:15px/1.5 -apple-system,system-ui,sans-serif}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:0 0 16px;color:#9fb1c4}
  table{border-collapse:collapse;width:100%}
  td{padding:8px 6px;border-top:1px solid #1c2735;vertical-align:top}
  td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ok{color:#7ee2a8}.bad{color:#ff9a8a}.wait{color:#9fb1c4}
  #ua{margin-top:18px;font-size:12px;color:#6f8297;word-break:break-all}
</style>
</head>
<body>
<h1>Aeolus connection check</h1>
<p>Times a few forecast requests from this browser. Takes up to a minute; a screenshot of the result is all that's needed.</p>
<table id="t"></table>
<div id="ua"></div>
<script>
const grid = (cols, rows) => {
  const la = [], lo = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    la.push((84 - 168 * r / Math.max(1, rows - 1)).toFixed(2)); lo.push((-180 + 360 * c / cols).toFixed(2));
  }
  return "https://api.open-meteo.com/v1/forecast?latitude=" + la.join(",") + "&longitude=" + lo.join(",")
    + "&hourly=wind_speed_10m,wind_direction_10m,temperature_2m,precipitation&wind_speed_unit=ms&forecast_days=3&timezone=GMT&timeformat=unixtime";
};
const checks = [
  ["This site (control)", "land.geo.json?probe=" + Date.now()],
  ["Forecast, 1 place", grid(1, 1)],
  ["Forecast, 24 places", grid(24, 1)],
  ["Forecast, 72 places", grid(24, 3)],
  ["Forecast, 288 places (the globe)", grid(24, 12)],
];
const t = document.getElementById("t");
document.getElementById("ua").textContent = navigator.userAgent;
(async () => {
  for (const [name, url] of checks){
    const tr = t.insertRow(), a = tr.insertCell(), b = tr.insertCell();
    a.textContent = name + (url.startsWith("http") ? " · " + url.length + " chars" : "");
    b.textContent = "…"; b.className = "wait";
    const ac = new AbortController(), t0 = performance.now();
    const timer = setTimeout(() => ac.abort(), 20000);
    try{
      const r = await fetch(url, { signal: ac.signal, cache: "no-store" });
      const body = await r.text();
      b.textContent = r.status + " · " + (body.length / 1024).toFixed(0) + " KB · " + ((performance.now() - t0) / 1000).toFixed(1) + " s";
      b.className = r.ok ? "ok" : "bad";
    }catch(e){
      b.textContent = (ac.signal.aborted ? "no answer in 20 s" : (e.message || e.name)) + " · " + ((performance.now() - t0) / 1000).toFixed(1) + " s";
      b.className = "bad";
    }finally{ clearTimeout(timer); }
  }
})();
</script>
</body>
</html>
