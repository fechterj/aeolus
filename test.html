<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeolus tests</title>
<style>
  body{margin:0;padding:16px;background:#06090f;color:#e9f0f7;font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
  h1{font-size:16px;letter-spacing:.2em;font-weight:600;margin:0 0 4px}
  #sum{margin:0 0 14px;color:#8fa1b3}
  h2{font-size:13px;margin:16px 0 6px;color:#6ee7ff;font-weight:600}
  li{list-style:none;padding:2px 0;font-variant-numeric:tabular-nums}
  ul{margin:0;padding:0}
  .pass::before{content:"✓ ";color:#50dcbe}
  .fail{color:#ff7a90}.fail::before{content:"✗ "}
  .skip{color:#8fa1b3}.skip::before{content:"– "}
  small{color:#8fa1b3}
  #stage{position:fixed;right:8px;bottom:8px;border:1px solid rgba(255,255,255,.15);transform-origin:bottom right;
    transform:scale(.3);background:#000;pointer-events:none}
  iframe{display:block;border:0}
</style>
</head>
<body>
<h1>AEOLUS TESTS</h1>
<p id="sum">running…</p>
<div id="out"></div>
<div id="stage"></div>
<script>
"use strict";
/* Open this page from the same server as index.html (it will not work from file://).
   It loads the real app in a frame at three screen sizes and checks what a person would notice:
   that everything fits, that controls are big enough to touch, and that touch, keyboard and dialogs work.
   Results are also left in window.testResults.
   Forecasts cost nothing: every frame's forecast requests are answered here, from one saved forecast.
   That forecast is the test page's own saved copy, else the real app's cached one, else one real request
   (kept for next time), else a made-up one. The summary line says which.
   Run it in a visible browser tab: a hidden or background tab is not told about size changes, so the
   "turned and resized" checks fail there even though the app is fine. */
const out = document.getElementById("out"), stage = document.getElementById("stage");
const results = []; window.testResults = results;
let group = "";
const section = name => { group = name; const h = document.createElement("h2"); h.textContent = name; out.append(h);
  const ul = document.createElement("ul"); ul.id = "g" + results.length + Math.random(); out.append(ul); section.ul = ul; };
function record(status, name, detail){
  results.push({ group, name, status, detail: detail || "" });
  const li = document.createElement("li"); li.className = status;
  li.textContent = name; if (detail){ const s = document.createElement("small"); s.textContent = "  " + detail; li.append(s); }
  section.ul.append(li);
}
const ok = (cond, name, detail) => record(cond ? "pass" : "fail", name, cond ? "" : detail);
const skip = (name, why) => record("skip", name, why);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms){ const t0 = performance.now(); while (performance.now() - t0 < ms){ if (fn()) return true; await sleep(100); } return false; }

/* ---------- one saved forecast, served to every frame ---------- */
const netLog = [];                    // every request a frame made through the hook
let seed = null, forecastSource = "none", realRequests = 0;
const GCOLS = 24, GROWS = 12;
function idbGet(db, store, key, create){
  return new Promise(res => {
    let rq; try { rq = indexedDB.open(db); } catch { return res(null); }
    rq.onupgradeneeded = () => { if (create) rq.result.createObjectStore(store, { keyPath: "k" }); else rq.transaction.abort(); };
    rq.onerror = () => res(null);
    rq.onsuccess = () => {
      const d = rq.result;
      try { const g = d.transaction(store).objectStore(store).get(key); g.onsuccess = () => { res(g.result || null); d.close(); }; g.onerror = () => { res(null); d.close(); }; }
      catch { d.close(); res(null); }
    };
  });
}
function idbPut(db, store, rec){
  return new Promise(res => {
    let rq; try { rq = indexedDB.open(db, 1); } catch { return res(false); }
    rq.onupgradeneeded = () => rq.result.createObjectStore(store, { keyPath: "k" });
    rq.onerror = () => res(false);
    rq.onsuccess = () => {
      const d = rq.result;
      try { const tx = d.transaction(store, "readwrite"); tx.objectStore(store).put(rec); tx.oncomplete = () => { d.close(); res(true); }; tx.onerror = tx.onabort = () => { d.close(); res(false); }; }
      catch { d.close(); res(false); }
    };
  });
}
// usable for testing: the 24 x 12 world grid, and "now" through the next six hours inside it
const seedUsable = f => !!(f && f.cols === GCOLS && f.rows === GROWS && Array.isArray(f.hours) && f.hours.length > 6 && f.hours[0].u && f.hours[0].u.length === GCOLS * GROWS
  && f.t0 * 1000 <= Date.now() && f.t1 * 1000 >= Date.now() + 6 * 3600e3);
async function fetchSeed(){
  const lats = [], lons = [];
  for (let r = 0; r < GROWS; r++){ const la = 84 - 168 * r / (GROWS - 1); for (let c = 0; c < GCOLS; c++){ lats.push(la.toFixed(2)); lons.push((-180 + 360 * c / GCOLS).toFixed(2)); } }
  realRequests++;
  const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lats.join(",") + "&longitude=" + lons.join(",")
    + "&hourly=wind_speed_10m,wind_direction_10m,temperature_2m,precipitation&wind_speed_unit=ms&forecast_days=3&timezone=GMT&timeformat=unixtime");
  if (!res.ok) return null;
  const data = await res.json();
  if (!Array.isArray(data) || data.length !== GCOLS * GROWS) return null;
  const times = data[0].hourly.time, hours = times.map(tm => ({ t: tm, u: new Float32Array(data.length), v: new Float32Array(data.length), tp: new Float32Array(data.length), pr: new Float32Array(data.length) }));
  data.forEach((pt, j) => times.forEach((_, h) => {
    const s = pt.hourly.wind_speed_10m[h] ?? 0, d = (pt.hourly.wind_direction_10m[h] ?? 0) * Math.PI / 180;
    hours[h].u[j] = -s * Math.sin(d); hours[h].v[j] = -s * Math.cos(d);
    hours[h].tp[j] = pt.hourly.temperature_2m[h] ?? 0; hours[h].pr[j] = pt.hourly.precipitation[h] ?? 0;
  }));
  return { lon0: -180, span: 360, latN: 84, latS: -84, cols: GCOLS, rows: GROWS, hours, t0: times[0], t1: times[times.length - 1], at: Date.now() };
}
function madeUpSeed(){
  const n = GCOLS * GROWS, t0 = Math.floor(Date.now() / 3600e3) * 3600 - 2 * 3600, hours = [];
  for (let h = 0; h < 72; h++){
    const o = { t: t0 + h * 3600, u: new Float32Array(n), v: new Float32Array(n), tp: new Float32Array(n), pr: new Float32Array(n) };
    for (let r = 0; r < GROWS; r++) for (let c = 0; c < GCOLS; c++){
      const j = r * GCOLS + c, la = 84 - 168 * r / (GROWS - 1), lo = -180 + 360 * c / GCOLS;
      o.u[j] = 9 * Math.cos(la * Math.PI / 60) + 2 * Math.sin((lo + h * 5) * Math.PI / 90); o.v[j] = 3 * Math.sin((lo - h * 3) * Math.PI / 45);
      o.tp[j] = 28 - Math.abs(la) * 0.6; o.pr[j] = Math.max(0, 5 * Math.exp(-((la - 8) ** 2 + ((lo - 20 + h) % 360) ** 2) / 500));
    }
    hours.push(o);
  }
  return { lon0: -180, span: 360, latN: 84, latS: -84, cols: GCOLS, rows: GROWS, hours, t0, t1: t0 + 71 * 3600, at: Date.now() };
}
const utc = ms => new Date(ms).toISOString().slice(0, 16).replace("T", " ") + " UTC";
async function prepareForecast(){
  const own = await idbGet("aeolus-cache-test", "fields", "seed", true);
  if (own && seedUsable(own.field)){ seed = own.field; forecastSource = "saved real forecast from " + utc(seed.at || own.saved) + " (the test page's copy)"; return; }
  const app = await idbGet("aeolus-cache", "fields", "globe", false);
  if (app && seedUsable(app.field)){ seed = app.field; forecastSource = "saved real forecast from " + utc(app.field.at || app.saved) + " (the app's cache)"; }
  else {
    try { seed = await fetchSeed(); } catch { seed = null; }
    if (seedUsable(seed)) forecastSource = "real forecast fetched just now";
    else { seed = madeUpSeed(); forecastSource = "made-up forecast (no saved one, and the service refused)"; return; }
  }
  await idbPut("aeolus-cache-test", "fields", { k: "seed", saved: Date.now(), field: seed });
}
function sampleSeed(lat, lon, h){
  const f = seed, fx = (((lon + 180) % 360 + 360) % 360) / 360 * f.cols;
  const fy = Math.min(Math.max((f.latN - lat) / (f.latN - f.latS) * (f.rows - 1), 0), f.rows - 1);
  const x0 = Math.floor(fx) % f.cols, x1 = (x0 + 1) % f.cols, tx = fx - Math.floor(fx);
  const y0 = Math.floor(fy), y1 = Math.min(y0 + 1, f.rows - 1), ty = fy - y0, A = f.hours[h];
  const bl = k => { const a = A[k]; return (a[y0 * f.cols + x0] * (1 - tx) + a[y0 * f.cols + x1] * tx) * (1 - ty) + (a[y1 * f.cols + x0] * (1 - tx) + a[y1 * f.cols + x1] * tx) * ty; };
  return { u: bl("u"), v: bl("v"), tp: bl("tp"), pr: bl("pr") };
}
const speedDir = s => [+Math.hypot(s.u, s.v).toFixed(2), Math.round(((Math.atan2(-s.u, -s.v) * 180 / Math.PI) + 360) % 360)];
function forecastBody(q){
  const lats = (q.get("latitude") || "").split(",").map(Number), lons = (q.get("longitude") || "").split(",").map(Number);
  const times = seed.hours.map(h => h.t), H = seed.hours.length;
  if (q.get("current")){                // the weather panel: one point, now, plus the next hours of wind
    const lat = lats[0], lon = lons[0], hc = Math.min(H - 1, Math.max(0, Math.round((Date.now() / 1000 - seed.t0) / 3600)));
    const s = sampleSeed(lat, lon, hc), [sp, dir] = speedDir(s);
    return { latitude: lat, longitude: lon,
      current: { wind_speed_10m: sp, wind_direction_10m: dir, wind_gusts_10m: +(sp * 1.5).toFixed(1), temperature_2m: +s.tp.toFixed(1), weather_code: s.pr > 0.2 ? 61 : 2, precipitation: +Math.max(0, s.pr).toFixed(1) },
      hourly: { time: times, wind_speed_10m: times.map((_, h) => speedDir(sampleSeed(lat, lon, h))[0]) } };
  }
  const pts = lats.map((lat, i) => {
    const ws = [], wd = [], tp = [], pr = [];
    for (let h = 0; h < H; h++){ const s = sampleSeed(lat, lons[i], h), [sp, dir] = speedDir(s); ws.push(sp); wd.push(dir); tp.push(+s.tp.toFixed(1)); pr.push(+Math.max(0, s.pr).toFixed(2)); }
    return { latitude: lat, longitude: lons[i], hourly: { time: times, wind_speed_10m: ws, wind_direction_10m: wd, temperature_2m: tp, precipitation: pr } };
  });
  return pts.length === 1 ? pts[0] : pts;
}
/* the hook index.html looks for: forecasts and place names come from here, everything else is real */
/* a frame can be told to meet a failing forecast service: "minutely", "hourly", "daily" (rate limits) or "broken" */
const faults = new Map(); let nextFault = null;
window.__aeolusTestFetch = (win, realFetch) => {
  if (nextFault === "nobitmap"){ try { win.createImageBitmap = undefined; } catch {} }   // like Safari before 15
  if (nextFault){ faults.set(win, nextFault); nextFault = null; }
  return serveFor(win, realFetch);
};
const LIMIT_REASON = { minutely: "Minutely API request limit exceeded. Please try again in one minute.",
  hourly: "Hourly API request limit exceeded. Please try again in the next hour.",
  daily: "Daily API request limit exceeded. Please try again tomorrow." };
const serveFor = (win, realFetch) => (input, opts) => {
  const url = String(input && input.url || input);
  let u; try { u = new URL(url, win.location.href); } catch { return realFetch(input, opts); }
  const reply = body => new Promise((res, rej) => setTimeout(() => {
    if (opts && opts.signal && opts.signal.aborted){ rej(new win.DOMException("aborted", "AbortError")); return; }
    res(new win.Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } }));
  }, 15));
  if (u.hostname === "api.open-meteo.com" && seed){
    const kind = u.searchParams.get("current") ? "point" : ((u.searchParams.get("latitude") || "").includes(",") ? "grid" : "point");
    netLog.push({ win, kind, url });
    const fault = faults.get(win);
    const serviceFault = fault === "broken" || (fault && LIMIT_REASON[fault] !== undefined);   // not nocities/nonight
    if (serviceFault && kind === "grid"){
      if (fault === "broken") return reply([{ latitude: 0, longitude: 0, hourly: { time: [1] } }]);   // a short, half-empty answer
      return new Promise(res => setTimeout(() => res(new win.Response(JSON.stringify({ error: true, reason: LIMIT_REASON[fault] }),
        { status: 429, headers: { "Content-Type": "application/json" } })), 15));
    }
    return reply(forecastBody(u.searchParams));
  }
  if (u.hostname === "api.bigdatacloud.net"){
    netLog.push({ win, kind: "place", url });
    return reply({ city: "Test point", principalSubdivision: "", countryName: "Testland" });
  }
  if ((faults.get(win) === "nocities" && /cities\.json/.test(u.pathname)) || (faults.get(win) === "nonight" && /nightlights\.jpg/.test(u.pathname))){
    netLog.push({ win, kind: "real", url });
    return Promise.resolve(new win.Response("missing", { status: 404 }));
  }
  netLog.push({ win, kind: "real", url });
  return realFetch(input, opts);
};

async function open(w, h, hash, fault){
  nextFault = fault || null;
  stage.textContent = "";
  const f = document.createElement("iframe");
  f.width = w; f.height = h; f.src = "index.html?test=" + Date.now() + (hash || "");
  stage.append(f);
  await new Promise(r => f.addEventListener("load", r, { once: true }));
  const win = f.contentWindow, doc = f.contentDocument;
  await until(() => win.aeolus, 5000);
  return { f, win, doc, w, h, $: s => doc.querySelector(s), $$: s => [...doc.querySelectorAll(s)] };
}
const rect = el => { const b = el.getBoundingClientRect(); return { l: b.left, t: b.top, r: b.right, b: b.bottom, w: b.width, h: b.height }; };
// not offsetParent: that is null for position:fixed elements, which is most of this page's chrome
const shown = el => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== "hidden";
const overlap = (a, b) => a.l < b.r - 1 && b.l < a.r - 1 && a.t < b.b - 1 && b.t < a.b - 1;
function key(win, k, extra){ win.dispatchEvent(new win.KeyboardEvent("keydown", Object.assign({ key: k, bubbles: true, cancelable: true }, extra || {}))); }
function touch(p, type, x, y, id){
  p.$("#map").dispatchEvent(new p.win.PointerEvent(type, { pointerId: id || 1, pointerType: "touch", clientX: x, clientY: y, bubbles: true, isPrimary: true }));
}

/* ---------- pure logic ---------- */
async function unitTests(p){
  section("Logic");
  const a = p.win.aeolus;
  ok(a.normLon(200) === -160 && a.normLon(-190) === 170 && a.normLon(45) === 45 && a.normLon(180) === -180, "longitude wraps into -180…180",
     [200, -190, 45, 180].map(a.normLon).join(","));
  let worst = 0;
  for (const [lon, lat] of [[a.globe.lon, a.globe.lat], [a.globe.lon + 30, a.globe.lat - 20], [a.globe.lon - 50, a.globe.lat + 35]]){
    const s = a.gscreen(a.gproj(lon, lat)), back = a.gunproject(s.x, s.y);
    if (!back){ worst = 999; break; }
    worst = Math.max(worst, Math.abs(a.normLon(back.lon - lon)), Math.abs(back.lat - lat));
  }
  ok(worst < 1e-6, "globe: screen point maps back to the same place", "worst error " + worst + "°");
  const g = a.globe;
  ok(a.gunproject(g.cx + g.r * 1.05, g.cy) === null, "globe: a tap outside the disc is ignored");
  ok(Math.abs(a.xToLon(a.lonToX(37.5)) - 37.5) < 1e-9 && Math.abs(a.yToLat(a.latToY(-51.2)) + 51.2) < 1e-9, "flat map: projection round-trips");
  const now = Date.now(), f = { hours: [1, 2, 3], t1: now / 1000 + 3600 };
  ok(a.fieldUsable({ field: f, saved: now }, 1e6) === true, "cache: a fresh forecast is usable");
  ok(a.fieldUsable({ field: f, saved: now - 2e6 }, 1e6) === false, "cache: an old forecast is refused");
  ok(a.fieldUsable({ field: { hours: [1, 2, 3], t1: now / 1000 - 10 }, saved: now }, 1e6) === false, "cache: a forecast that ended is refused");
  ok(a.fieldUsable(null, 1e6) === false && a.fieldUsable({ saved: now }, 1e6) === false, "cache: junk is refused");
  await until(() => a.citySource === "Natural Earth", 6000);
  ok(a.cities >= 7000 && a.citySource === "Natural Earth", "the full list of cities and towns loads", a.cities + " from " + a.citySource);
  // the light pulse: a smooth pattern over the sphere, never flicker
  let lo = 9, hi = -9, worstNear = 0;
  for (let k = 0; k < 400; k++){
    const lon = -180 + (k * 137.5) % 360, lat = -80 + (k * 61.8) % 160, ts = k * 0.37;
    const v = a.pulseAt(lon, lat, ts), w = a.pulseAt(lon + 0.3, lat + 0.2, ts);
    lo = Math.min(lo, v); hi = Math.max(hi, v); worstNear = Math.max(worstNear, Math.abs(v - w));
  }
  ok(lo >= 1 - a.PULSE_DEPTH - 1e-6 && hi <= 1 + 1e-6, "the light pulse stays between " + (1 - a.PULSE_DEPTH) + " and full brightness", lo.toFixed(3) + "…" + hi.toFixed(3));
  ok(worstNear < 0.03, "neighbouring lights pulse together (a pattern, not noise)", "largest difference " + worstNear.toFixed(3));
  ok(Math.abs(a.pulseAt(20, 10, 0) - a.pulseAt(20, 10, 24)) < 1e-6 && Math.abs(a.pulseAt(20, 10, 0) - a.pulseAt(20, 10, 12)) > 0.01, "the pulse turns once every 24 seconds");
  // temperature colours: smooth through the grid, never creased at its lines, and exact at each point
  const tf = { cols: 4, rows: 4, t0: 0, hours: [{ tp: Float32Array.from([0,0,0,0, 0,10,20,0, 0,30,5,0, 0,0,0,0]) }, { tp: Float32Array.from([0,0,0,0, 0,10,20,0, 0,30,5,0, 0,0,0,0]) }] };
  const exact = [[1,1,10],[2,1,20],[1,2,30],[2,2,5]].every(([x,y,v]) => Math.abs(a.tempCubic(tf, x, y, 0, false) - v) < 1e-6);
  const e = 1e-4, slope = x => (a.tempCubic(tf, x + e, 1.5, 0, false) - a.tempCubic(tf, x - e, 1.5, 0, false)) / (2 * e);
  const kink = Math.abs(slope(2 - 0.001) - slope(2 + 0.001));
  ok(exact && kink < 0.5, "temperature colours pass through each forecast point and bend smoothly across grid lines",
     (exact ? "exact at the points" : "misses a point") + ", slope change at a grid line " + kink.toFixed(3));
  ok((a.tempGradient().match(/rgb\(/g) || []).length === a.TEMP_STOPS.length, "the temperature legend is drawn from the same colours as the map");

  // rain: one wet grid point becomes a soft round shower; never negative, no straight creased edges
  const rp = new Float32Array(64); rp[3 * 8 + 3] = 4;
  const rf = { cols: 8, rows: 8, t0: 0, hours: [{ pr: rp }, { pr: rp }] };
  let neg = false, far = 0;
  for (let y = 0; y <= 7; y += 0.25) for (let x = 0; x <= 7; x += 0.25){
    const v = a.rainSmooth(rf, x, y, 0, false); if (v < 0) neg = true;
    if (Math.max(Math.abs(x - 3), Math.abs(y - 3)) >= 2) far = Math.max(far, v);
  }
  const rs = x => (a.rainSmooth(rf, x + 1e-4, 3.3, 0, false) - a.rainSmooth(rf, x - 1e-4, 3.3, 0, false)) / 2e-4;
  const rkink = Math.abs(rs(4 - 0.001) - rs(4 + 0.001));
  ok(!neg && far < 1e-9 && rkink < 0.05, "rain from one grid point is a soft round shower: never negative, no creased edge, gone two points away",
     (neg ? "negative somewhere, " : "") + "slope change at a grid line " + rkink.toFixed(4) + ", " + far.toExponential(1) + " left far away");
  let drizzle = [0, 0], heavyLow = 9;
  for (let k = 0; k < 300; k++){
    const lon = -180 + k * 1.37, lat = -60 + (k * 0.71) % 120;
    if (a.rainShown(0.15, lon, lat, 0) > 0) drizzle[0]++; else drizzle[1]++;
    heavyLow = Math.min(heavyLow, a.rainShown(5, lon, lat, 0) / 5);
  }
  ok(drizzle[0] > 20 && drizzle[1] > 20 && heavyLow > 0.3, "light rain breaks into patches, heavy rain stays solid",
     drizzle[0] + " wet / " + drizzle[1] + " dry spots at 0.15 mm/h; heavy rain keeps at least " + (heavyLow * 100).toFixed(0) + "%");
  const shades = new Set(); for (let p = 0.01; p <= 0.2; p += 0.005) shades.add(a.rainColor(p));
  ok(shades.size >= 12, "drizzle fades in through many shades, not a few hard rings", shades.size + " shades from 0 to 0.2 mm/h");
  ok((a.rainGradient().match(/rgba\(/g) || []).length === a.RAIN_STOPS.length, "the rain legend is drawn from the same colours as the map");
  ok(/^rgba\(\d+,\d+,\d+,0\.6\)$/.test(a.speedColor(12)) && a.speedColor(-5) === a.speedColor(0) && a.speedColor(999) === a.speedColor(40),
     "wind colour scale clamps at both ends");
}

/* ---------- one screen size ---------- */
async function sizeTests(label, w, h, wantMobile){
  section(label + " — " + w + "×" + h);
  const p = await open(w, h), a = p.win.aeolus;
  if (!a){ ok(false, "app starts", "no aeolus handle after 5 s"); return null; }
  ok(true, "app starts");
  ok(a.mobile === wantMobile, wantMobile ? "uses the phone layout" : "uses the wide layout", "mobile=" + a.mobile);
  const gotData = await until(() => a.ready, 20000);
  await sleep(600);
  const loaderGone = p.$("#loader").classList.contains("gone");
  ok(loaderGone, "loading screen clears", "still showing after 20 s");
  if (!gotData) skip("forecast arrived", "no data (offline or rate-limited): " + (p.$("#toast").textContent || "no message"));
  else ok(true, "forecast arrived");

  // everything fits
  ok(p.doc.documentElement.scrollWidth <= w && p.doc.documentElement.scrollHeight <= h, "page does not scroll",
     p.doc.documentElement.scrollWidth + "×" + p.doc.documentElement.scrollHeight);
  const controls = p.$$("button,input").filter(shown).filter(e => !e.closest("#chips"));
  const outside = controls.filter(e => { const r = rect(e); return r.l < -1 || r.t < -1 || r.r > w + 1 || r.b > h + 1; });
  ok(outside.length === 0, "every control is on screen", outside.map(e => e.id || e.textContent.trim()).join(", "));
  const blocks = ["header", "#legend", "#zoomctl", wantMobile ? "#dock" : "#timebar"].map(s => [s, p.$(s)]).filter(x => x[1] && shown(x[1]));
  const clashes = [];
  for (let i = 0; i < blocks.length; i++) for (let j = i + 1; j < blocks.length; j++){

/* ---------- time, links and dialogs ---------- */
function idbCount(db, store){                 // read-only: never creates the database
  return new Promise(res => {
    let rq; try { rq = indexedDB.open(db); } catch { return res(null); }
    rq.onupgradeneeded = () => rq.transaction.abort();
    rq.onerror = () => res(0);
    rq.onsuccess = () => { const d = rq.result; try { const c = d.transaction(store).objectStore(store).count(); c.onsuccess = () => { res(c.result); d.close(); }; c.onerror = () => { res(null); d.close(); }; } catch { d.close(); res(0); } };
  });
}

/* ---------- a failing forecast service ---------- */
function idbDel(db, store, keys){
  return new Promise(res => {
    let rq; try { rq = indexedDB.open(db, 1); } catch { return res(false); }
    rq.onupgradeneeded = () => rq.result.createObjectStore(store, { keyPath: "k" });
    rq.onerror = () => res(false);
    rq.onsuccess = () => {
      const d = rq.result;
      try { const tx = d.transaction(store, "readwrite"); for (const k of keys) tx.objectStore(store).delete(k); tx.oncomplete = () => { d.close(); res(true); }; tx.onerror = tx.onabort = () => { d.close(); res(false); }; }
      catch { d.close(); res(false); }
    };
  });
}

  const nb = await open(375, 812, "", "nobitmap"), nba = nb.win.aeolus;
  const viaImg = await until(() => nba.nightSource === "Black Marble", 8000);
  ok(typeof nb.win.createImageBitmap !== "function" && viaImg, "NASA lights load in browsers without createImageBitmap", nba.nightSource);

  // the GPU drops its context and gets it back: the lights come back too
  const ext = nb.win.document.getElementById("nightgl").getContext("webgl").getExtension("WEBGL_lose_context");
  if (!ext || !viaImg) skip("NASA lights come back after the graphics context is lost", ext ? "lights never loaded" : "no WEBGL_lose_context");
  else {
    ext.loseContext(); await sleep(300);
    const gone = nba.nightSource === "dots";
    ext.restoreContext();
    const back = await until(() => nba.nightSource === "Black Marble", 8000);
    ok(gone && back, "NASA lights come back after the graphics context is lost", (gone ? "lost, " : "never lost, ") + nba.nightSource);
  }
  await forgetForecasts();
}

/* ---------- shared links ---------- */
async function linkTests(){
  section("Shared links");
  const tq = Math.round((Date.now() + 3*3600e3)/900000)*900000;
  const iso = new Date(tq).toISOString().slice(0,16) + "Z";
  const p = await open(375, 812, "#m=f&ll=35.68,139.69&z=5&l=wt&t=" + iso), a = p.win.aeolus;
  ok(a.mode === "flat", "a link opens in the mode it names", "mode=" + a.mode);
  ok(Math.abs(a.view.lat - 35.68) < 0.05 && Math.abs(a.view.lon - 139.69) < 0.05, "a link opens on the place it names",
     a.view.lat.toFixed(2) + "," + a.view.lon.toFixed(2));
  ok(Math.abs(a.view.zoom - 5) < 0.01, "a link opens at its zoom", "zoom " + a.view.zoom);
  ok(a.show.wind && a.show.temp && !a.show.rain, "a link turns on the layers it names", JSON.stringify(a.show));
  ok(Math.abs(a.time - tq) < 60000, "a link opens at its forecast time", new Date(a.time).toISOString());
  const gotData = await until(() => a.ready, 20000);
  if (!gotData){ skip("the address follows the view", "no forecast: " + (p.$("#toast").textContent || "no message")); }
  else {
    touch(p, "pointerdown", 180, 320); touch(p, "pointermove", 120, 300); touch(p, "pointermove", 90, 290); touch(p, "pointerup", 90, 290);
    await sleep(2200);
    const h = p.win.location.hash;
    ok(/m=f/.test(h) && /t=/.test(h) && !/ll=35\.68,139\.69/.test(h), "the address follows the view and keeps the chosen time", h);
  }
  ok(a.formatLink(a.parseLink(a.link)) === a.link, "a link reads back to exactly itself", a.link);
  const sb = p.$("#sharebtn");
  ok(!!sb && shown(sb), "share button is there");
  if (sb){
    p.$("#toast").textContent = "";
    sb.click();
    await sleep(900);
    ok(/Link copied|Copy this link/.test(p.$("#toast").textContent), "share gives you the link", p.$("#toast").textContent.slice(0, 80) || "no message");
  }
  const q = await open(375, 812, "#m=zz&ll=abc,999&z=nope&l=<b>&t=yesterday&p=1,2,3"), b = q.win.aeolus;
  ok(!!b && b.mode === "globe" && !q.$("#panel").classList.contains("open"), "a broken link falls back to the normal start", b ? "mode=" + b.mode : "no app");
  await sleep(1200);
  ok(!/problem starting/.test(q.$("#toast").textContent), "a broken link raises no error", q.$("#toast").textContent.slice(0, 80));
  const r = await open(375, 812, "#m=g&ll=48.85,2.35&z=1.2&l=w&p=48.857,2.352"), c = r.win.aeolus;
  ok(Math.abs(c.normLon(c.globe.lon - 2.35)) < 4 && Math.abs(c.globe.lat - 48.85) < 0.5, "a globe link turns the globe to its place",
     c.globe.lon.toFixed(1) + "," + c.globe.lat.toFixed(1));
  ok(await until(() => r.$("#panel").classList.contains("open"), 3000), "a link with a point opens that point's weather");

  // zoomed in past 84 degrees north the grid used to shrink to one row: every wind and temperature reading became NaN
  const pn = netLog.length;
  const po = await open(375, 812, "#m=f&ll=85,10&z=7&l=wt"), pa = po.win.aeolus;
  await until(() => pa.ready, 8000); await sleep(1500);
  const gridUrl = netLog.slice(pn).find(n => n.win === po.win && n.kind === "grid");
  const rows = gridUrl ? new Set(new URL(gridUrl.url).searchParams.get("latitude").split(",")).size : 0;
  const L = pa.lats;
  ok(pa.ready && pa.frameErrs === 0 && L.hi >= L.lo && (!gridUrl || rows > 1), "zoomed in at the top of the map: wind and temperature still draw",
     (gridUrl ? rows + " grid rows, " : "from the saved forecast, ") + pa.frameErrs + " frame errors, wind at " + L.lo.toFixed(1) + "…" + L.hi.toFixed(1) + "°");
}

/* ---------- one screen, turned and resized ---------- */
async function reflowTests(){
  section("One screen, turned and resized");
  const p = await open(375, 812), a = p.win.aeolus;
  await until(() => a.ready, 20000);
  const setSize = async (w, h) => { p.f.width = w; p.f.height = h; await sleep(800); };
  await setSize(812, 375);
  const zc = rect(p.$("#zoomctl")), hd = rect(p.$("header")), dk = rect(p.$("#dock")), g = a.globe;
  ok(a.mobile === true && a.size.W === 812, "turned on its side: still the phone layout", "mobile=" + a.mobile + " W=" + a.size.W);
  ok(!overlap(zc, hd) && !overlap(zc, dk), "turned: zoom buttons clear the top bar and the dock", "zoom " + Math.round(zc.t) + "…" + Math.round(zc.b));
  ok(g.cy - g.r >= hd.b - 2 && g.cy + g.r <= dk.t + 20, "turned: the globe re-fits", "disc " + Math.round(g.cy - g.r) + "…" + Math.round(g.cy + g.r));
  await setSize(1280, 800);
  ok(a.mobile === false && p.$("#layers").parentNode.id === "leftcol" && p.$("#timebar").parentNode === p.doc.body
     && p.$("#globebtn").parentNode.id === "xp" && p.$("#units").parentNode.id === "topright", "widened: controls go back to their wide-screen places");
  const order = [...p.$("#xp").children].map(e => e.id).join(",");
  ok(order === "silkbtn,globebtn,cinebtn,capbtn,sharebtn,galbtn", "widened: mode buttons are in their original order", order);
  const tr = [...p.$("#topright").children].map(e => e.id).join(",");
  ok(tr === "searchwrap,locate,units,helpbtn", "widened: top-right buttons are in their original order", tr);
  await setSize(375, 812);
  ok(a.mobile === true && p.$("#timebar").parentNode.id === "dock" && p.$("#globebtn").parentNode.id === "chips", "narrowed again: controls return to the dock");

  // request budget: on a zoomed-out flat map, moving about must not re-download the forecast each time
  section("Request budget");
  const grids = () => netLog.filter(n => n.win === p.win && n.kind === "grid").length;
  key(p.win, "g");
  for (let i = 0; i < 5; i++) key(p.win, "-");
  const flatReady = await until(() => a.mode === "flat" && a.ready, 15000);
  await sleep(2500);
  if (!flatReady){ skip("flat map: small drags cost no forecast requests", "no flat forecast: " + (p.$("#toast").textContent || "no message")); return; }
  const n0 = grids();
  for (let i = 0; i < 6; i++){
    const d = i % 2 ? -10 : 10;
    touch(p, "pointerdown", 180, 320); touch(p, "pointermove", 180 + d, 326); touch(p, "pointerup", 180 + d, 326);
    await sleep(120);
  }
  await sleep(1600);
  ok(grids() === n0, "flat map, zoomed out: small drags cost no forecast requests", (grids() - n0) + " extra requests after 6 drags");
}

(async () => {
  let realGallery = null;
  try {
    await prepareForecast();
    realGallery = await idbCount("aeolus-skies", "skies");
    const phone = await sizeTests("Phone, upright", 375, 812, true);
    if (phone) await unitTests(phone);
    await sizeTests("Small phone", 320, 568, true);
    await sizeTests("Phone, on its side", 812, 375, true);
    await sizeTests("Tablet / laptop", 1280, 800, false);
    await reflowTests();
    await linkTests();
    await stateTests();
    await faultTests();
    section("Your own data");
    const after = await idbCount("aeolus-skies", "skies");
    ok(after === realGallery, "a test run adds nothing to the real gallery", realGallery + " → " + after);
  } catch (e) {
    section("Runner"); ok(false, "tests ran to the end", String(e && e.stack || e));
  }
  stage.textContent = "";
  const n = s => results.filter(r => r.status === s).length;
  const sum = document.getElementById("sum");
  sum.textContent = n("pass") + " passed · " + n("fail") + " failed · " + n("skip") + " skipped";
  const served = netLog.filter(x => x.kind === "grid" || x.kind === "point").length;
  const info = document.createElement("small");
  info.textContent = "  ·  forecast: " + forecastSource + " · " + served + " forecast requests answered locally, "
    + realRequests + " sent to the forecast service";
  sum.append(info);
  window.testForecast = { source: forecastSource, served, realRequests };
  sum.style.color = n("fail") ? "#ff7a90" : "#50dcbe";
  window.testsDone = true;
})();
</script>
