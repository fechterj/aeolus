<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeolus tests</title>
<style>
  body{margin:0;padding:16px;background:#06090f;color:#e9f0f7;font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
  h1{font-size:16px;letter-spacing:.2em;font-weight:600;margin:0 0 4px}
  #sum{margin:0 0 14px;color:#8fa1b3}
  h2{font-size:13px;margin:16px 0 6px;color:#6ee7ff;font-weight:600}
  li{list-style:none;padding:2px 0;font-variant-numeric:tabular-nums}
  ul{margin:0;padding:0}
  .pass::before{content:"✓ ";color:#50dcbe}
  .fail{color:#ff7a90}.fail::before{content:"✗ "}
  .skip{color:#8fa1b3}.skip::before{content:"– "}
  small{color:#8fa1b3}
  #stage{position:fixed;right:8px;bottom:8px;border:1px solid rgba(255,255,255,.15);transform-origin:bottom right;
    transform:scale(.3);background:#000;pointer-events:none}
  iframe{display:block;border:0}
</style>
</head>
<body>
<h1>AEOLUS TESTS</h1>
<p id="sum">running…</p>
<div id="out"></div>
<div id="stage"></div>
<script>
"use strict";
/* Open this page from the same server as index.html (it will not work from file://).
   It loads the real app in a frame at three screen sizes and checks what a person would notice:
   that everything fits, that controls are big enough to touch, and that touch, keyboard and dialogs work.
   Results are also left in window.testResults.
   Run it in a visible browser tab: a hidden or background tab is not told about size changes, so the
   "turned and resized" checks fail there even though the app is fine. */
const out = document.getElementById("out"), stage = document.getElementById("stage");
const results = []; window.testResults = results;
let group = "";
const section = name => { group = name; const h = document.createElement("h2"); h.textContent = name; out.append(h);
  const ul = document.createElement("ul"); ul.id = "g" + results.length + Math.random(); out.append(ul); section.ul = ul; };
function record(status, name, detail){
  results.push({ group, name, status, detail: detail || "" });
  const li = document.createElement("li"); li.className = status;
  li.textContent = name; if (detail){ const s = document.createElement("small"); s.textContent = "  " + detail; li.append(s); }
  section.ul.append(li);
}
const ok = (cond, name, detail) => record(cond ? "pass" : "fail", name, cond ? "" : detail);
const skip = (name, why) => record("skip", name, why);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms){ const t0 = performance.now(); while (performance.now() - t0 < ms){ if (fn()) return true; await sleep(100); } return false; }

async function open(w, h){
  stage.textContent = "";
  const f = document.createElement("iframe");
  f.width = w; f.height = h; f.src = "index.html?test=" + Date.now();
  stage.append(f);
  await new Promise(r => f.addEventListener("load", r, { once: true }));
  const win = f.contentWindow, doc = f.contentDocument;
  await until(() => win.aeolus, 5000);
  return { f, win, doc, w, h, $: s => doc.querySelector(s), $$: s => [...doc.querySelectorAll(s)] };
}
const rect = el => { const b = el.getBoundingClientRect(); return { l: b.left, t: b.top, r: b.right, b: b.bottom, w: b.width, h: b.height }; };
// not offsetParent: that is null for position:fixed elements, which is most of this page's chrome
const shown = el => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== "hidden";
const overlap = (a, b) => a.l < b.r - 1 && b.l < a.r - 1 && a.t < b.b - 1 && b.t < a.b - 1;
function key(win, k, extra){ win.dispatchEvent(new win.KeyboardEvent("keydown", Object.assign({ key: k, bubbles: true, cancelable: true }, extra || {}))); }
function touch(p, type, x, y, id){
  p.$("#map").dispatchEvent(new p.win.PointerEvent(type, { pointerId: id || 1, pointerType: "touch", clientX: x, clientY: y, bubbles: true, isPrimary: true }));
}

/* ---------- pure logic ---------- */
async function unitTests(p){
  section("Logic");
  const a = p.win.aeolus;
  ok(a.normLon(200) === -160 && a.normLon(-190) === 170 && a.normLon(45) === 45 && a.normLon(180) === -180, "longitude wraps into -180…180",
     [200, -190, 45, 180].map(a.normLon).join(","));
  let worst = 0;
  for (const [lon, lat] of [[a.globe.lon, a.globe.lat], [a.globe.lon + 30, a.globe.lat - 20], [a.globe.lon - 50, a.globe.lat + 35]]){
    const s = a.gscreen(a.gproj(lon, lat)), back = a.gunproject(s.x, s.y);
    if (!back){ worst = 999; break; }
    worst = Math.max(worst, Math.abs(a.normLon(back.lon - lon)), Math.abs(back.lat - lat));
  }
  ok(worst < 1e-6, "globe: screen point maps back to the same place", "worst error " + worst + "°");
  const g = a.globe;
  ok(a.gunproject(g.cx + g.r * 1.05, g.cy) === null, "globe: a tap outside the disc is ignored");
  ok(Math.abs(a.xToLon(a.lonToX(37.5)) - 37.5) < 1e-9 && Math.abs(a.yToLat(a.latToY(-51.2)) + 51.2) < 1e-9, "flat map: projection round-trips");
  const now = Date.now(), f = { hours: [1, 2, 3], t1: now / 1000 + 3600 };
  ok(a.fieldUsable({ field: f, saved: now }, 1e6) === true, "cache: a fresh forecast is usable");
  ok(a.fieldUsable({ field: f, saved: now - 2e6 }, 1e6) === false, "cache: an old forecast is refused");
  ok(a.fieldUsable({ field: { hours: [1, 2, 3], t1: now / 1000 - 10 }, saved: now }, 1e6) === false, "cache: a forecast that ended is refused");
  ok(a.fieldUsable(null, 1e6) === false && a.fieldUsable({ saved: now }, 1e6) === false, "cache: junk is refused");
  ok(/^rgba\(\d+,\d+,\d+,0\.6\)$/.test(a.speedColor(12)) && a.speedColor(-5) === a.speedColor(0) && a.speedColor(999) === a.speedColor(40),
     "wind colour scale clamps at both ends");
}

/* ---------- one screen size ---------- */
async function sizeTests(label, w, h, wantMobile){
  section(label + " — " + w + "×" + h);
  const p = await open(w, h), a = p.win.aeolus;
  if (!a){ ok(false, "app starts", "no aeolus handle after 5 s"); return null; }
  ok(true, "app starts");
  ok(a.mobile === wantMobile, wantMobile ? "uses the phone layout" : "uses the wide layout", "mobile=" + a.mobile);
  const gotData = await until(() => a.ready, 20000);
  await sleep(600);
  const loaderGone = p.$("#loader").classList.contains("gone");
  ok(loaderGone, "loading screen clears", "still showing after 20 s");
  if (!gotData) skip("forecast arrived", "no data (offline or rate-limited): " + (p.$("#toast").textContent || "no message"));
  else ok(true, "forecast arrived");

  // everything fits
  ok(p.doc.documentElement.scrollWidth <= w && p.doc.documentElement.scrollHeight <= h, "page does not scroll",
     p.doc.documentElement.scrollWidth + "×" + p.doc.documentElement.scrollHeight);
  const controls = p.$$("button,input").filter(shown).filter(e => !e.closest("#chips"));
  const outside = controls.filter(e => { const r = rect(e); return r.l < -1 || r.t < -1 || r.r > w + 1 || r.b > h + 1; });
  ok(outside.length === 0, "every control is on screen", outside.map(e => e.id || e.textContent.trim()).join(", "));
  const blocks = ["header", "#legend", "#zoomctl", wantMobile ? "#dock" : "#timebar"].map(s => [s, p.$(s)]).filter(x => x[1] && shown(x[1]));
  const clashes = [];
  for (let i = 0; i < blocks.length; i++) for (let j = i + 1; j < blocks.length; j++){
    // header is a full-width strip on wide screens; compare its real children instead
    const A = blocks[i][0] === "header" && !wantMobile ? ["#leftcol", "#topright"].map(s => rect(p.$(s))) : [rect(blocks[i][1])];
    if (A.some(ra => overlap(ra, rect(blocks[j][1])))) clashes.push(blocks[i][0] + " × " + blocks[j][0]);
  }
  ok(clashes.length === 0, "panels do not sit on top of each other", clashes.join(", "));

  if (wantMobile){
    const small = p.$$("button,input").filter(shown).map(e => [e, rect(e)]).filter(x => x[1].w < 43.5 || x[1].h < 43.5);
    ok(small.length === 0, "every control is at least 44 px to touch", small.map(x => (x[0].id || x[0].textContent.trim()) + " " + Math.round(x[1].w) + "×" + Math.round(x[1].h)).join(", "));
    ok(parseFloat(getComputedStyle(p.$("#search")).fontSize) >= 16, "search text is 16 px, so iPhones do not zoom in on focus", getComputedStyle(p.$("#search")).fontSize);
    const g = a.globe, top = rect(p.$("header")).b, bottom = rect(p.$("#dock")).t;
    ok(g.cy - g.r >= top - 2 && g.cy + g.r <= bottom + 20, "globe sits between the top bar and the dock",
       "disc " + Math.round(g.cy - g.r) + "…" + Math.round(g.cy + g.r) + ", free " + Math.round(top) + "…" + Math.round(bottom));
    // upright, the legend strip sits between the globe and the dock
    const floor = h >= w && shown(p.$("#legend")) ? rect(p.$("#legend")).t : bottom;
    ok(g.cy + g.r <= floor + 2, "globe stays clear of the legend", "disc bottom " + Math.round(g.cy + g.r) + ", legend top " + Math.round(floor));
    ok(g.r * 2 >= Math.min(w, floor - top) * 0.8, "globe uses most of the free space", "diameter " + Math.round(g.r * 2));
    const blur = ["#timebar", "#brand", "#legend"].map(sel => getComputedStyle(p.$(sel)).backdropFilter || getComputedStyle(p.$(sel)).webkitBackdropFilter || "none");
    ok(blur.every(b => b === "none"), "panels are solid on a phone (no live blur over the animation)", blur.join(" / "));
    const tiny = p.$$("#legend .title,#legend .labels,#attr,#timelabel,.tbtn,#chips button").filter(shown)
      .map(e => [e, parseFloat(getComputedStyle(e).fontSize)]).filter(x => x[1] < 9.5);
    ok(tiny.length === 0, "no control text is smaller than 9.5 px", tiny.map(x => (x[0].id || x[0].className) + " " + x[1]).join(", "));
    const chips = p.$("#chips");
    ok(chips.scrollWidth > chips.clientWidth ? getComputedStyle(chips).overflowX === "auto" : true, "layer and mode row scrolls sideways when it does not fit");
    const gb = rect(p.$("#globebtn"));
    ok(gb.l >= 0 && gb.r <= w + 1, "globe switch is visible without scrolling", Math.round(gb.l) + "…" + Math.round(gb.r));
  } else {
    ok(!shown(p.$("#dock")), "dock is not used on a wide screen");
    ok(p.$("#layers").parentNode.id === "leftcol" && p.$("#timebar").parentNode === p.doc.body, "controls are back in their wide-screen places");
  }

  // touch
  const g0 = a.globe;
  touch(p, "pointerdown", g0.cx, g0.cy); touch(p, "pointermove", g0.cx - 40, g0.cy); touch(p, "pointermove", g0.cx - 70, g0.cy + 5); touch(p, "pointerup", g0.cx - 70, g0.cy + 5);
  ok(Math.abs(a.globe.lon - g0.lon) > 3, "dragging turns the globe", "lon moved " + (a.globe.lon - g0.lon).toFixed(2) + "°");
  const r0 = a.globe.r;
  touch(p, "pointerdown", g0.cx - 30, g0.cy, 1); touch(p, "pointerdown", g0.cx + 30, g0.cy, 2);
  touch(p, "pointermove", g0.cx - 60, g0.cy, 1); touch(p, "pointermove", g0.cx + 60, g0.cy, 2);
  touch(p, "pointerup", g0.cx - 60, g0.cy, 1); touch(p, "pointerup", g0.cx + 60, g0.cy, 2);
  ok(a.globe.r > r0 * 1.2, "pinching zooms the globe", "radius ×" + (a.globe.r / r0).toFixed(2));
  // an iPhone sends a gesture event on top of the pointer events for the same pinch
  const rG = a.globe.r;
  touch(p, "pointerdown", g0.cx, g0.cy, 5);
  const ge = new p.win.Event("gesturechange", { bubbles: true, cancelable: true }); ge.scale = 2; ge.clientX = g0.cx; ge.clientY = g0.cy;
  p.$("#map").dispatchEvent(ge);
  touch(p, "pointerup", g0.cx, g0.cy, 5);
  ok(Math.abs(a.globe.r - rG) < 0.5, "a pinch is not counted twice on iPhones", "radius ×" + (a.globe.r / rG).toFixed(2));
  await sleep(450); p.$("#panel .close").click();
  // double-tap
  const rD = a.globe.r, gd = a.globe;
  touch(p, "pointerdown", gd.cx, gd.cy); touch(p, "pointerup", gd.cx, gd.cy);
  touch(p, "pointerdown", gd.cx + 3, gd.cy + 2); touch(p, "pointerup", gd.cx + 3, gd.cy + 2);
  await sleep(450);
  ok(a.globe.r > rD * 1.5, "double-tap zooms in", "radius ×" + (a.globe.r / rD).toFixed(2));
  ok(!p.$("#panel").classList.contains("open"), "double-tap does not also open the weather panel");
  key(p.win, "-"); key(p.win, "-"); key(p.win, "-"); key(p.win, "-");
  const g1 = a.globe;
  touch(p, "pointerdown", g1.cx, g1.cy); touch(p, "pointerup", g1.cx, g1.cy);
  const opened = await until(() => p.$("#panel").classList.contains("open"), 1500);
  ok(opened, "tapping the globe opens the weather for that point");
  if (opened){
    await sleep(300);
    // layout box, not the painted box: the panel slides in with a transform
    const pe = p.$("#panel"), pr = { l: pe.offsetLeft, t: pe.offsetTop, r: pe.offsetLeft + pe.offsetWidth, b: pe.offsetTop + pe.offsetHeight };
    ok(pr.l >= 0 && pr.r <= w + 1 && pr.t >= 0 && pr.b <= h + 1, "weather panel fits on screen", [pr.l, pr.t, pr.r, pr.b].map(Math.round).join(","));
    const sp = p.$("#spark");
    ok(pe.contains(sp) && getComputedStyle(sp).position === "static" && sp.offsetTop > 40 && sp.offsetTop + sp.offsetHeight <= pe.scrollHeight + 1,
       "24-hour wind chart is drawn inside the weather panel", "position " + getComputedStyle(sp).position + ", top " + sp.offsetTop);
    p.$("#panel .close").click();
    ok(!p.$("#panel").classList.contains("open"), "weather panel closes");
  }

  // layers and legend
  const temp = p.$('[data-l="temp"]');
  temp.click();
  ok(temp.getAttribute("aria-pressed") === "true" && p.$$("#legend .section").length === 2, "turning on temperature adds it to the legend");
  if (wantMobile){ const lg = rect(p.$("#legend")), gg = a.globe; ok(lg.r <= w + 1 && lg.h < 110, "legend stays compact with two layers", Math.round(lg.w) + "×" + Math.round(lg.h)); }
  temp.click();

  // keyboard
  const m0 = a.mode;
  key(p.win, "g", { metaKey: true });
  ok(a.mode === m0, "Cmd+G is left to the browser");
  const sl = p.$("#slider"); sl.value = sl.max; sl.dispatchEvent(new p.win.Event("input", { bubbles: true }));
  key(p.win, "g");
  ok(a.mode !== m0, "G switches between globe and flat map");
  key(p.win, "g");
  const rg = a.range;
  ok(!!rg && a.time >= rg.t0 && a.time <= rg.t1, "time stays inside the forecast after switching modes");
  p.$("#nowbtn").click();
  const lon0 = a.globe.lon;
  key(p.win, "ArrowRight");
  ok(Math.abs(a.normLon(a.globe.lon - lon0) - 8) < 0.5, "right arrow turns the globe east", "moved " + a.normLon(a.globe.lon - lon0).toFixed(2) + "°");

  // dialog
  const hb = p.$("#helpbtn"); hb.focus(); hb.click();
  const help = p.$("#help");
  ok(help.classList.contains("open") && help.contains(p.doc.activeElement), "help opens and takes keyboard focus");
  const hr = rect(p.$("#help .card"));
  ok(hr.t >= 0 && hr.b <= h + 1 && hr.l >= 0 && hr.r <= w + 1, "help fits on screen", [hr.l, hr.t, hr.r, hr.b].map(Math.round).join(","));
  key(p.win, "Escape");
  ok(!help.classList.contains("open") && p.doc.activeElement === hb, "Escape closes help and returns focus");

  // cinema: what is hidden is out of reach
  const pb = rect(p.$("#play"));
  key(p.win, "c");
  const under = p.doc.elementFromPoint(pb.l + pb.w / 2, pb.t + pb.h / 2);
  ok(a.cinema && !(under && under.closest("button,input")), "cinema: hidden controls cannot be tapped", under ? under.tagName + "#" + under.id : "nothing there");
  key(p.win, "x");
  ok(!a.cinema, "cinema: any key returns");

  // stray pointers
  p.$("#map").dispatchEvent(new p.win.PointerEvent("pointerdown", { pointerId: 9, pointerType: "mouse", button: 2, clientX: 50, clientY: 300, bubbles: true }));
  ok(a.pointers === 0, "a right-click does not leave a phantom finger on the map", "pointers=" + a.pointers);
  touch(p, "pointerdown", 100, 300, 4);
  p.win.dispatchEvent(new p.win.Event("blur"));
  ok(a.pointers === 0, "losing the window lets go of held touches", "pointers=" + a.pointers);

  await sleep(400);
  const la = a.lats;
  ok(la.lo >= -90 && la.hi <= 90, "wind particles stay between the poles", la.lo.toFixed(1) + "…" + la.hi.toFixed(1));
  return p;
}

/* ---------- one screen, turned and resized ---------- */
async function reflowTests(){
  section("One screen, turned and resized");
  const p = await open(375, 812), a = p.win.aeolus;
  await until(() => a.ready, 20000);
  const setSize = async (w, h) => { p.f.width = w; p.f.height = h; await sleep(800); };
  await setSize(812, 375);
  const zc = rect(p.$("#zoomctl")), hd = rect(p.$("header")), dk = rect(p.$("#dock")), g = a.globe;
  ok(a.mobile === true && a.size.W === 812, "turned on its side: still the phone layout", "mobile=" + a.mobile + " W=" + a.size.W);
  ok(!overlap(zc, hd) && !overlap(zc, dk), "turned: zoom buttons clear the top bar and the dock", "zoom " + Math.round(zc.t) + "…" + Math.round(zc.b));
  ok(g.cy - g.r >= hd.b - 2 && g.cy + g.r <= dk.t + 20, "turned: the globe re-fits", "disc " + Math.round(g.cy - g.r) + "…" + Math.round(g.cy + g.r));
  await setSize(1280, 800);
  ok(a.mobile === false && p.$("#layers").parentNode.id === "leftcol" && p.$("#timebar").parentNode === p.doc.body
     && p.$("#globebtn").parentNode.id === "xp" && p.$("#units").parentNode.id === "topright", "widened: controls go back to their wide-screen places");
  const order = [...p.$("#xp").children].map(e => e.id).join(",");
  ok(order === "silkbtn,globebtn,cinebtn,capbtn,galbtn", "widened: mode buttons are in their original order", order);
  const tr = [...p.$("#topright").children].map(e => e.id).join(",");
  ok(tr === "searchwrap,locate,units,helpbtn", "widened: top-right buttons are in their original order", tr);
  await setSize(375, 812);
  ok(a.mobile === true && p.$("#timebar").parentNode.id === "dock" && p.$("#globebtn").parentNode.id === "chips", "narrowed again: controls return to the dock");

  // request budget: on a zoomed-out flat map, moving about must not re-download the forecast each time
  section("Request budget");
  p.win.performance.setResourceTimingBufferSize(3000);
  const grids = () => p.win.performance.getEntriesByType("resource").filter(e => e.name.includes("api.open-meteo.com/v1/forecast") && e.name.length > 1500).length;
  key(p.win, "g");
  for (let i = 0; i < 5; i++) key(p.win, "-");
  const flatReady = await until(() => a.mode === "flat" && a.ready, 15000);
  await sleep(2500);
  if (!flatReady){ skip("flat map: small drags cost no forecast requests", "no flat forecast: " + (p.$("#toast").textContent || "no message")); return; }
  const n0 = grids();
  for (let i = 0; i < 6; i++){
    const d = i % 2 ? -10 : 10;
    touch(p, "pointerdown", 180, 320); touch(p, "pointermove", 180 + d, 326); touch(p, "pointerup", 180 + d, 326);
    await sleep(120);
  }
  await sleep(1600);
  ok(grids() === n0, "flat map, zoomed out: small drags cost no forecast requests", (grids() - n0) + " extra requests after 6 drags");
}

(async () => {
  try {
    const phone = await sizeTests("Phone, upright", 375, 812, true);
    if (phone) await unitTests(phone);
    await sizeTests("Small phone", 320, 568, true);
    await sizeTests("Phone, on its side", 812, 375, true);
    await sizeTests("Tablet / laptop", 1280, 800, false);
    await reflowTests();
  } catch (e) {
    section("Runner"); ok(false, "tests ran to the end", String(e && e.stack || e));
  }
  stage.textContent = "";
  const n = s => results.filter(r => r.status === s).length;
  const sum = document.getElementById("sum");
  sum.textContent = n("pass") + " passed · " + n("fail") + " failed · " + n("skip") + " skipped";
  sum.style.color = n("fail") ? "#ff7a90" : "#50dcbe";
  window.testsDone = true;
})();
</script>
</body>
</html>
