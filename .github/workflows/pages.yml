# Publishes the site, with a fresh forecast.json, on every push and once an hour.
name: Publish
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gather the site
        run: |
          mkdir _site
          cp index.html test.html probe.html cities.json land.geo.json nightlights.jpg og.jpg LICENSE README.md _site/
      - name: Fetch the forecast
        run: node tools/forecast.mjs _site/forecast.json https://fechterj.github.io/aeolus/forecast.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
